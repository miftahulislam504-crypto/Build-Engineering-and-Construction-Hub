<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EngineX Mart — অফলাইন</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 380px;
    }
    .icon-wrap {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: #eff6ff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1e3a8a;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    button {
      background: #1d4ed8;
      color: white;
      border: none;
      font-size: 14px;
      font-weight: 500;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1e40af; }
    .brand {
      margin-top: 32px;
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h.01"></path>
        <path d="M8.5 16.5a5 5 0 0 1 7 0"></path>
        <path d="M5 12.5a10 10 0 0 1 14 0"></path>
        <path d="M1.5 9a15 15 0 0 1 21 0"></path>
        <line x1="2" y1="2" x2="22" y2="22"></line>
      </svg>
    </div>
    <h1>ইন্টারনেট সংযোগ নেই</h1>
    <p>মনে হচ্ছে আপনি এখন অফলাইনে আছেন। সংযোগ ফিরে এলে পেজটি আবার লোড করুন — আপনার cart এবং wishlist নিরাপদে সংরক্ষিত আছে।</p>
    <button onclick="window.location.reload()">আবার চেষ্টা করুন</button>
    <p class="brand">EngineX Mart</p>
  </div>
</body>
</html>
